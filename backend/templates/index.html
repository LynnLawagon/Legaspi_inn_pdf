<!-- templates/index.html (FULL) - same UI, no secondary, keeps hidden id-category -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guest Data OCR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

<div class="hero">

  <div id="drop-area">
    <input type="file" id="input-file" accept="image/*,.pdf" style="display:none;" />

    <div id="img-view">
      <div class="media-box">
        <img id="preview-img" src="{{ url_for('static', filename='img/upload.png') }}" alt="Preview"/>
        <video id="camera" autoplay playsinline></video>

        <button id="snap-btn" type="button" aria-label="Snap Photo">
          <img src="{{ url_for('static', filename='img/camera.png') }}" alt="Camera">
        </button>

        <div id="loading-indicator">Scanning...</div>
      </div>

      <p id="drop-text">Upload your ID here</p>
      <span>Supports School ID / National ID (Primary)</span>
    </div>

    <div class="top-actions">
      <button class="records-btn" type="button" onclick="window.location.href='/records'">
        View Saved PDFs
      </button>

      <button id="back-home-btn" class="back-home-btn" type="button" onclick="window.location.href='/'">
        Back to Home
      </button>
    </div>
  </div>

  <div id="ocr-results">
    <h2>Results</h2>

    <div class="form-group"><label>Reference ID:</label><input id="ref-id" readonly /></div>
    <div class="form-group"><label>Age:</label><input id="age" readonly /></div>

    <input type="hidden" id="id-slot" value="primary">
    <input type="hidden" id="id-category" value="PRIMARY">

    <div class="form-group"><label>Can Proceed:</label><input id="can-proceed" readonly /></div>

    <div class="form-group"><label>ID Type:</label><input id="id-type" readonly/></div>
    <div class="form-group"><label>ID Number:</label><input id="id-no"/></div>

    <div class="form-group"><label>First Name:</label><input id="first-name"/></div>
    <div class="form-group"><label>Middle Name:</label><input id="middle-name"/></div>
    <div class="form-group"><label>Last Name:</label><input id="last-name"/></div>

    <div class="form-group"><label>Date of Birth:</label><input id="dob" type="text" placeholder="YYYY-MM-DD"/></div>

    <div class="form-group">
      <label>Gender:</label>
      <select id="gender_id"></select>
    </div>

    <div class="form-group">
      <label>Contact:</label>
      <input id="contact" inputmode="numeric" maxlength="11" placeholder="09XXXXXXXXX"/>
    </div>

    <div class="form-group"><label>Address:</label><input id="address"/></div>

    <div class="btn-row">
      <button id="toggle-btn" type="button">Use Camera</button>
      <button id="recalc-btn" type="button">Recalculate Age</button>
      <button id="retry-btn" type="button">Retry</button>
      <button id="export-btn" type="button" disabled>Save</button>
      <button id="new-guest-btn" type="button">New Guest</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
